theme = "lydia-transparent"

[editor]
line-number = "relative"
cursorline = false
color-modes = true
auto-save = true
auto-format = true
trim-trailing-whitespace = true
popup-border = "all"
jump-label-alphabet = "asdflkjwerpio"

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.soft-wrap]
enable = true
wrap-at-text-width = false

[editor.indent-guides]
render = true
character = "┊"
skip-levels = 1

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.statusline]
left = ["mode", "file-base-name", "file-modification-indicator", "spinner"]
center = []
right = ["diagnostics", "version-control", "position"]
mode.normal = "N"
mode.insert = "I"
mode.select = "S"
diagnostics = ["warning", "error"]
workspace-diagnostics = ["warning", "error"]

[keys.normal]
"X" = "extend_line_up"
"ret" = "goto_word"
"}" = ["goto_next_paragraph", "collapse_selection"]
"{" = ["goto_prev_paragraph", "collapse_selection"]
# Use a scratch buffer so cancellation never edits the current document.
# Register z is reserved for the helper's safely quoted open/cd macro.
"C-y" = '''@:new<ret>:insert-output sh "${XDG_CONFIG_HOME:-$HOME/.config}/helix/yazi-picker.sh" 2<gt>/dev/tty || printf ":redraw<lt>ret<gt>"<ret>%"zy:buffer-close!<ret>"zq'''

[keys.select]
"}" = "goto_next_paragraph"
"{" = "goto_prev_paragraph"

[keys.normal."]"]
"]" = "goto_next_buffer"

[keys.normal."["]
"[" = "goto_previous_buffer"
